name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux

      # Автоформат: если формат нарушен — правки коммитятся обратно в ветку.
      - name: Auto-format (cargo fmt)
        if: github.event_name == 'push'
        run: cargo fmt --all
      - name: Commit formatting changes
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: cargo fmt [skip ci]"
            git push
          else
            echo "No formatting changes."
          fi

      # На PR только проверяем, не фиксим (фикс пойдёт при следующем пуше в main).
      - name: Check fmt (PR)
        if: github.event_name == 'pull_request'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all --verbose
      - name: build (release)
        run: cargo build --release --all

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp target/release/tots-client dist/tots-client-linux-x86_64
          cp target/release/tots-server dist/tots-server-linux-x86_64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: build (release)
        run: cargo build --release --all

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\tots-client.exe dist\tots-client-windows-x86_64.exe
          Copy-Item target\release\tots-server.exe dist\tots-server-windows-x86_64.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux
          path: release

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-windows
          path: release

      - name: Compute tag (YY.MM.DD.HH.MM UTC)
        id: tag
        run: |
          tag=$(date -u +'%y.%m.%d.%H.%M')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag"

      - name: Checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
