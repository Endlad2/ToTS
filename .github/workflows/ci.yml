name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

  linux-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux client
        run: cargo build -p tots-client --release
      - name: Verify Linux client
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/tots-client
          file target/release/tots-client

  macos-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build macOS client
        run: cargo build -p tots-client --release
      - name: Verify macOS client
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/tots-client
          file target/release/tots-client

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p tots-client --release

  android-client:
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Android arm64 executable and APK-safe libtots.so
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build-android.sh aarch64-linux-android
          test -x dist/android/arm64-v8a/libtots.so
          file dist/android/arm64-v8a/libtots.so
          readelf -h dist/android/arm64-v8a/libtots.so | grep -q 'Machine:.*AArch64'
