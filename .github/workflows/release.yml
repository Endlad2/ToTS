name: release

# Тег собирается из UTC-времени запуска: ГГ.ММ.ДД.час.минута (например 26.10.18.2145).
# Релиз публикуется всегда, ручным запуском или пушем в main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"
  GORELEASER_VERSION: "v2.17.1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag (UTC ГГ.ММ.ДД.час.минута)
        id: tag
        run: |
          set -euo pipefail
          TAG="$(date -u +%y.%m.%d.%H%M)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Computed release tag: $TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create git tag and empty release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Тег из времени UTC: коллизия в пределах минуты теоретически возможна только при
          # параллельных ручных запусках, их режет concurrency выше.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, refusing to overwrite" >&2
            exit 1
          fi
          git tag -a "$TAG" -m "ToTS $TAG"
          git push origin "$TAG"

          # goreleaser с mode: replace не умеет публиковать поверх существующего
          # черновика, поэтому создаём пустой релиз здесь, а goreleaser зальёт в него ассеты.
          gh release create "$TAG" \
            --title "ToTS $TAG" \
            --notes "Сборка ToTS от $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --draft

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Привязываем сборку к тегу, который только что создали, а не к предыдущему.
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
          GORELEASER_FORCE_TOKEN: "github"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest

      - name: Summary
        run: |
          {
            echo "### ToTS release ${{ steps.tag.outputs.tag }}"
            echo ""
            echo "Ассеты:"
            echo '```'
            ls -la dist/ 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
