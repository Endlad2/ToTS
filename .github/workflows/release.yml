name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - run: cargo build -p tots-server --release
      - name: package
        run: |
          mkdir dist
          cp target/release/tots-server dist/
          cp scripts/setup-network.sh dist/
          cp systemd/tots-server.service dist/
          cp tots-server/config.example.env dist/
          tar -C dist -czf tots-server-x86_64-unknown-linux-gnu.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          files: tots-server-x86_64-unknown-linux-gnu.tar.gz
