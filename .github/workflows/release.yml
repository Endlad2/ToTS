name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: "stable"

jobs:
  build-desktop:
    name: Desktop binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tots-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tots-linux-arm64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tots-windows-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tots-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tots-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p tots-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }}.tar.gz tots
          cd -
          shasum -a 256 ${{ matrix.archive }}.tar.gz > ${{ matrix.archive }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/tots.exe -DestinationPath ${{ matrix.archive }}.zip
          Get-FileHash ${{ matrix.archive }}.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  ${{ matrix.archive }}.zip" } | Out-File ${{ matrix.archive }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.zip
            ${{ matrix.archive }}.tar.gz.sha256
            ${{ matrix.archive }}.zip.sha256
          if-no-files-found: ignore

  build-mobile:
    name: Mobile cores (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            archive: tots-android-arm64
          - target: armv7-linux-androideabi
            archive: tots-android-armv7
          - target: x86_64-linux-android
            archive: tots-android-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Android NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_SDK_ROOT/ndk/*/ 2>/dev/null | sort -V | tail -n1)
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> $GITHUB_ENV

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2

      - name: Build shared core
        run: cargo ndk -t ${{ matrix.target }} build --release -p tots-core

      - name: Package
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/libtots_core.so out/ 2>/dev/null || true
          cd out && zip -r ../${{ matrix.archive }}.zip . && cd -
          sha256sum ${{ matrix.archive }}.zip > ${{ matrix.archive }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.zip
            ${{ matrix.archive }}.zip.sha256

  build-ios:
    name: iOS XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Build static libs
        run: |
          cargo build --release --target aarch64-apple-ios        -p tots-core
          cargo build --release --target x86_64-apple-ios         -p tots-core
          cargo build --release --target aarch64-apple-ios-sim    -p tots-core

      - name: Assemble XCFramework
        run: |
          set -e
          mkdir -p out/headers
          echo '// ToTS core C ABI is generated by cbindgen in the app build.' > out/headers/tots.h
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libtots_core.a \
            -library target/x86_64-apple-ios/release/libtots_core.a \
            -library target/aarch64-apple-ios-sim/release/libtots_core.a \
            -headers out/headers \
            -output out/TotsCore.xcframework
          cd out && zip -r ../tots-ios.xcframework.zip TotsCore.xcframework && cd -
          shasum -a 256 tots-ios.xcframework.zip > tots-ios.xcframework.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: tots-ios
          path: |
            tots-ios.xcframework.zip
            tots-ios.xcframework.zip.sha256

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-mobile, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}