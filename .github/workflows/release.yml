name: Release
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tots-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Linux server
        run: cargo build -p tots-server --release

      - name: Package Linux server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/tots-server dist/
          cp scripts/setup-network.sh dist/
          cp systemd/tots-server.service dist/
          cp tots-server/config.example.env dist/
          tar -C dist -czf tots-server-x86_64-unknown-linux-gnu.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: tots-server-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error


  linux-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Linux client
        run: cargo build -p tots-client --release

      - name: Package Linux client
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          mkdir -p dist-linux-client
          cp target/release/tots-client dist-linux-client/
          cp LICENSE NOTICE dist-linux-client/
          cat > dist-linux-client/README-LINUX.txt <<'EOF'
          ToTS Linux client
          =================

          Run with the privileges required to create/configure the TUN interface.

          Example:
            sudo ./tots-client --config "tots://..." --n 20 --relay-only --tun-default-route
          EOF
          tar -czf "$PWD/tots-client-x86_64-unknown-linux-gnu.tar.gz" -C dist-linux-client .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: tots-client-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  macos-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build macOS client
        run: cargo build -p tots-client --release

      - name: Package macOS client
        shell: bash
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64)
              TARGET_NAME="aarch64-apple-darwin"
              ;;
            x86_64)
              TARGET_NAME="x86_64-apple-darwin"
              ;;
            *)
              echo "Unsupported macOS runner architecture: $ARCH" >&2
              exit 1
              ;;
          esac
          mkdir -p dist-macos-client
          cp target/release/tots-client dist-macos-client/
          cp LICENSE NOTICE dist-macos-client/
          cat > dist-macos-client/README-MACOS.txt <<'EOF'
          ToTS macOS client
          =================

          Run with the privileges required to create/configure the TUN interface.

          Example:
            sudo ./tots-client --config "tots://..." --n 20 --relay-only --tun-default-route
          EOF
          tar -czf "$PWD/tots-client-${TARGET_NAME}.tar.gz" -C dist-macos-client .

      - uses: actions/upload-artifact@v4
        with:
          name: macos-client
          path: tots-client-*-apple-darwin.tar.gz
          if-no-files-found: error

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows client
        run: cargo build -p tots-client --release

      - name: Download and verify Wintun
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          $archive = Join-Path $PWD "wintun-0.14.1.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
          if ($actual -ne $expected) {
            throw "Wintun SHA-256 mismatch: expected $expected, got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath ".wintun" -Force

      - name: Package Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "dist-win" -Force | Out-Null
          Copy-Item "target\release\tots-client.exe" "dist-win\tots-client.exe"
          Copy-Item ".wintun\wintun\bin\amd64\wintun.dll" "dist-win\wintun.dll"
          if (Test-Path ".wintun\wintun\LICENSE.txt") {
            Copy-Item ".wintun\wintun\LICENSE.txt" "dist-win\WINTUN-LICENSE.txt"
          }
          @"
          ToTS Windows client
          ===================

          Run tots-client.exe as Administrator.
          Keep wintun.dll in the same directory as tots-client.exe.

          Example:
            tots-client.exe --config "tots://..."
          "@ | Set-Content -Encoding UTF8 "dist-win\README-WINDOWS.txt"
          Compress-Archive -Path "dist-win\*" -DestinationPath "tots-client-x86_64-pc-windows-msvc.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: tots-client-x86_64-pc-windows-msvc.zip
          if-no-files-found: error


  android-client:
    name: Android client (${{ matrix.abi }})
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "24"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            machine: AArch64
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            machine: ARM
          - target: x86_64-linux-android
            abi: x86_64
            machine: Advanced Micro Devices X86-64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Android ${{ matrix.abi }} executable
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build-android.sh "${{ matrix.target }}"
          test -x "dist/android/${{ matrix.abi }}/libtots.so"
          file "dist/android/${{ matrix.abi }}/libtots.so"
          readelf -h "dist/android/${{ matrix.abi }}/libtots.so" | grep -q "Machine:.*${{ matrix.machine }}"
          cp "dist/android/${{ matrix.abi }}/libtots.so" "libtots-${{ matrix.abi }}.so"

      - uses: actions/upload-artifact@v4
        with:
          name: android-lib-${{ matrix.abi }}
          path: libtots-${{ matrix.abi }}.so
          if-no-files-found: error

  android-package:
    needs: android-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-lib-arm64-v8a
          path: android-libs/arm64-v8a

      - uses: actions/download-artifact@v4
        with:
          name: android-lib-armeabi-v7a
          path: android-libs/armeabi-v7a

      - uses: actions/download-artifact@v4
        with:
          name: android-lib-x86_64
          path: android-libs/x86_64

      - name: Package Android clients
        shell: bash
        run: |
          set -euo pipefail
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            test -f "android-libs/$ABI/libtots-$ABI.so"
            mkdir -p "dist-android/jniLibs/$ABI"
            cp "android-libs/$ABI/libtots-$ABI.so" "dist-android/jniLibs/$ABI/libtots.so"
          done
          cp LICENSE NOTICE dist-android/
          cp Providers/jazz-session/LICENSE dist-android/JAZZ-SESSION-LICENSE
          cat > dist-android/README-ANDROID.txt <<'EOF'
          ToTS Android client
          ===================

          This archive contains APK-ready executable payloads for:
            jniLibs/arm64-v8a/libtots.so
            jniLibs/armeabi-v7a/libtots.so
            jniLibs/x86_64/libtots.so

          Each libtots.so is a PIE executable renamed for APK native-library packaging.
          It is not a JNI cdylib.

          The Android VpnService host must:
            1. create/configure the TUN interface;
            2. use the virtual IPv4 and MTU from the tots:// config;
            3. pass an inherited descriptor with --tun-fd;
            4. keep ToTS's own transport sockets outside the VPN tunnel (for example by
               excluding the hosting package/UID or using an equivalent protection strategy).

          Example argv:
            libtots.so --config tots://... --n 20 --relay-only --tun-fd 42
          EOF
          (cd dist-android && zip -r ../tots-android-multiabi.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: android-client
          path: tots-android-multiabi.zip
          if-no-files-found: error

  publish:
    needs: [linux-server, linux-client, macos-client, windows-client, android-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create timestamp tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          # Tag format: YY.DD.MM.HH.MM (UTC), for example 26.09.11.17.18.
          # If another workflow already claimed the current minute, wait until
          # a free minute tag is available instead of overwriting a release.
          while true; do
            TAG="$(date -u +'%y.%d.%m.%H.%M')"

            git fetch --force --tags origin
            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              sleep 2
              continue
            fi

            git tag "$TAG" "$GITHUB_SHA"
            if git push origin "refs/tags/$TAG"; then
              break
            fi

            git tag -d "$TAG" >/dev/null 2>&1 || true
            sleep 2
          done

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ToTS ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/tots-server-x86_64-unknown-linux-gnu.tar.gz
            release-assets/tots-client-x86_64-unknown-linux-gnu.tar.gz
            release-assets/tots-client-*-apple-darwin.tar.gz
            release-assets/tots-client-x86_64-pc-windows-msvc.zip
            release-assets/tots-android-multiabi.zip
