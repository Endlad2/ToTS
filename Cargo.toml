[workspace]
resolver = "2"
members = [
    "crates/tots-providers",
    "crates/tots-core",
    "crates/tots-wire",
    "crates/tots-client",
    "crates/tots-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ToTS contributors"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "gzip", "brotli"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
url = "2.5"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
chacha20poly1305 = "0.10"
bytes = "1.7"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
socket2 = "0.5"
uuid = { version = "1.10", features = ["v4"] }
yamux = "0.12"
